name: Release

# Publishes @taliffsss/unisms to npm. Triggered either by pushing a
# `vX.Y.Z` tag directly, or by publishing a GitHub Release (which can
# create the tag for you). Both paths converge on the same job; `npm
# publish` is naturally idempotent here since npm refuses to overwrite an
# already-published version.
on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve tag version
        id: tag
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag v${{ steps.tag.outputs.version }} does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
